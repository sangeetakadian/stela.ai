name: Test assessment-tagging Realtime Database rules

on:
  push:
    paths:
      - "frontend/database.rules.json"
      - "frontend/firebase.json"
      - "frontend/rules_tests/**"
      - ".github/workflows/test_assessment_tagging_rules.yml"
  pull_request:
    paths:
      - "frontend/database.rules.json"
      - "frontend/firebase.json"
      - "frontend/rules_tests/**"
      - ".github/workflows/test_assessment_tagging_rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/rules_tests/package-lock.json

      - name: Set up Java for the Realtime Database Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install rules test dependencies
        working-directory: frontend/rules_tests
        run: npm ci

      - name: Run rules tests in the Firebase Emulator
        working-directory: frontend/rules_tests
        run: npm run test:emulator
